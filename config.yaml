# J.A.R.V.I.S. — Konfiguration
# Profile: dev (Arbeits-PC, Radeon, kein 7B) | home (GTX 1660 Ti, F:-NVMe, 7B-Schwerlast)
profile: home

# Fensterhintergrund: dark = durchgehend dunkle Fläche (gut bei hellem Wallpaper)
#                     transparent = nur der Orb schwebt, Desktop scheint durch
window_bg: dark

# Abgesegnete Orb-Engine-Parameter (Nutzer-Tuning, Seed 5 — siehe Design-Spec 2026-06-11)
orb:
  sparks: 250
  veins: 25
  rays: 4
  ring_brightness: 0.5
  bloom: 0.9
  speed: 0.7
  seed: 5
  size_px: 240     # Standardgröße; per Mausrad über dem Orb stufenlos änderbar
  backdrop: 0.85   # dunkler Hof hinter dem Orb für helle Wallpaper (0 = aus, 1 = max)

ollama:
  host: "http://127.0.0.1:11434"
  keep_alive: "30m"        # Residenz der 3B-Spezialisten (ADR 0001)

voice_ws:                  # Schnittstelle App ↔ Sprach-Daemon
  host: "127.0.0.1"
  port: 8765

browser:                   # Browser-Steuerung (chrome-devtools-mcp, braucht Node + Chrome)
  enabled: true
  profile_dir: ".chrome-jarvis"   # dauerhaftes, isoliertes Jarvis-Profil (nie der echte Chrome)
  channel: "stable"
  headless: false                 # sichtbarer Browser
  max_steps: 6                    # Obergrenze Werkzeug-Schritte pro Anfrage
  search_engine: "google"

briefing:                  # Tagesbriefing (Doppelklatsch / „Briefing" / Panel-Knopf)
  github_repo: "FabianLampe/jarvis-desktop"   # offene Issues (Token: JARVIS_GITHUB_TOKEN in .env)
  github_issue_limit: 20
  gmail_enabled: true                 # Gmail nur-lesen (Setup: python -m jarvis_core.briefing.gmail --login)
  gmail_max: 10
  weather: { lat: 53.55, lon: 9.99, ort: "Hamburg" }   # dein Ort für Open-Meteo

voice:                     # Sprach-Daemon (start_daemon.bat)
  wake_word: "hey_jarvis"  # vortrainiertes openWakeWord-Modell — akzent-robust
  wake_threshold: 0.55     # 0–1; niedriger = empfindlicher
  interrupt_threshold: 0.32 # „Hey Jarvis“ mitten in seine Antwort = unterbrechen (niedrig = empfindlich)
  stt_model: "small"       # faster-whisper auf CPU (keine VRAM-Konkurrenz)
  stt_language: "de"       # Deutsch erzwungen — kein Auto-Detect mehr
  tts_engine: "xtts"       # xtts = geklonte Film-Stimme · edge = schnelle Neural-Stimme (Internet)
  xtts_speaker_wav: "voice_daemon/assets/jarvis_reference.wav"  # aus „Jarvis voice.mp3"
  xtts_device: "auto"      # auto | cuda | cpu — cuda: RTF ~0,6, teilt sich das VRAM mit dem LLM
  tts_voice: "de-DE-FlorianMultilingualNeural"  # Alternativen: de-DE-KillianNeural, de-DE-ConradNeural
  tts_rate: "-8%"          # gemessenes Sprechtempo — der Film-Jarvis hetzt nie
  tts_pitch: "-3Hz"        # einen Hauch tiefer
  robotic: 0.0             # 0–1: optionaler Roboter-Anstrich der Stimme; 0 = aus (klare Klonstimme)
  robotic_carrier_hz: 55   # Trägerfrequenz der Ringmodulation (tiefer = grollender, höher = blecherner)
  tts_max_chars: 1200
  input_device: null       # null = Standardmikrofon (sonst Index oder Name)
  output_device: null
  beep: true               # kurzer Ton, wenn Jarvis zuhört
  max_utterance_s: 14.0
  silence_after_s: 0.9
  follow_up_s: 6.0         # Gesprächsmodus: nach der Antwort weiterzuhören (0 = aus)
  clap_enabled: true       # Doppelklatsch löst das Tagesbriefing aus
  clap_threshold: 4.0      # RMS-Vielfaches über Grundpegel (höher = unempfindlicher)
  clap_gap_min_s: 0.15     # Mindestabstand der zwei Klatscher
  clap_gap_max_s: 0.8      # Höchstabstand
  clap_cooldown_s: 3.0     # Sperre nach Auslösung

profiles:
  dev:
    general: "qwen3.5:0.8b"
    coder: "qwen3.5:0.8b"
    heavy: null            # kein 7B ⇒ Schalter ausgeblendet, Status "NICHT VERFÜGBAR"
    gpu_monitor: false     # kein nvidia-smi ⇒ "VRAM —"
    num_ctx: 2048
    # Entscheidung 2026-06-15: geklonte XTTS-Stimme auf der GPU (2,9 GB) hat
    # Vorrang (Nutzerwunsch). Daneben passt nur EIN kleines LLM ins 6-GB-VRAM
    # → qwen2.5:3b (1,9 GB) für beide Spuren, warm 0,2 s / 75 T/s. gemma3:4b
    # würde mit XTTS das VRAM sprengen und bei echten Prompts hängenbleiben.
    # Hartes Coding/Wissenschaft weiterhin per „Schwerlast" (7B, dann ohne XTTS).
    general: "qwen2.5:3b"
    coder: "qwen2.5:3b"
    heavy: "qwen2.5:7b"
    gpu_monitor: true
    num_ctx: 2048
